<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0d10; color: #fff; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { background: #12151a; border: 1px solid #333; border-radius: 12px; padding: 28px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #9aa0a6; font-size: 0.9rem; margin: 0 0 16px; }
    label { display: block; font-size: 0.8rem; color: #9aa0a6; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #444; background: #0b0d10; color: #fff; box-sizing: border-box; }
    button { margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #fff; color: #000; font-weight: 700; cursor: pointer; }
    .msg { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
    .ok { background: #0d2f1c; border: 1px solid #137333; display: block; }
    .err { background: #2f0d0d; border: 1px solid #c5221f; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create admin account</h1>
    <p>Use this once. After success, go to Admin login.</p>
    <label>Email</label>
    <input type="email" id="email" value="tonnynjoroge001@gmail.com" />
    <label>Password (min 8 characters)</label>
    <input type="password" id="password" placeholder="Choose a strong password" />
    <label>Name</label>
    <input type="text" id="name" value="Admin" />
    <button id="btn">Create admin</button>
    <div class="msg" id="msg"></div>
    <p style="margin-top:16px"><a href="/admin/" style="color:#8ab4f8">Go to Admin login →</a></p>
  </div>
  <script>
    document.getElementById('btn').onclick = async function () {
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.textContent = 'Working…';
      msg.style.display = 'block';
      try {
        const res = await fetch('/api/setup/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            name: document.getElementById('name').value.trim() || 'Admin'
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        msg.className = 'msg ok';
        msg.textContent = data.message || 'Admin created. Go to Admin login.';
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = e.message;
      }
    };
  </script>
</body>
</html>
